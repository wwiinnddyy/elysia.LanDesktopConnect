name: Validate Elysia.LanDesktopConnect

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  BUN_VERSION: "1.3.14"
  # lanmountain 源的凭据槽（NuGet.config 用 %VAR% 取用）。实测工作流自带的 GITHUB_TOKEN 就读得到公开包：
  # 同一 job 里假 token 报 NU1301/401，换成 GITHUB_TOKEN 就还原成功——不需要再配 PAT 或仓库 secret。
  LANMOUNTAIN_PACKAGES_USER: ${{ github.actor }}
  LANMOUNTAIN_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

concurrency:
  group: elysia-landesktopconnect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Elysia.LanDesktopConnect

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: Elysia.LanDesktopConnect

      - name: Checkout LanAirApp validator
        uses: actions/checkout@v7
        with:
          repository: wwiinnddyy/LanAirApp
          path: LanAirApp

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore and type-check gateway
        shell: pwsh
        working-directory: Elysia.LanDesktopConnect/elysia-gateway
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Smoke-test gateway transport
        shell: pwsh
        run: .\scripts\Test-GatewaySmoke.ps1

      - name: Validate committed metadata
        shell: pwsh
        run: .\scripts\Test-PluginConsistency.ps1 -RepositoryRoot (Resolve-Path ".").Path

      - name: Restore plugin without shared cache
        shell: pwsh
        run: dotnet restore .\Elysia.LanDesktopConnect.csproj --force --no-cache -v minimal

      # 构建即打包：AirApp SDK 的 MSBuild target 产出 .laapp，
      # 并强制校验 airapp.json 与 .deps.json 存在。
      - name: Build plugin package
        shell: pwsh
        run: dotnet build .\Elysia.LanDesktopConnect.csproj -c Release --no-restore -v minimal

      - name: Generate and validate market manifest
        shell: pwsh
        run: |
          $manifest = Get-Content .\airapp.json -Encoding UTF8 -Raw | ConvertFrom-Json
          $assetName = "$($manifest.id).$($manifest.version).laapp"
          .\scripts\New-MarketManifest.ps1 `
            -TemplatePath .\airappmarket-entry.template.json `
            -PackagePath ".\$assetName" `
            -Version $manifest.version `
            -ReleaseTag "v$($manifest.version)" `
            -OutputPath .\artifacts\market-manifest.json

          .\scripts\Test-PluginConsistency.ps1 `
            -RepositoryRoot (Resolve-Path ".").Path `
            -PackagePath ".\$assetName" `
            -MarketManifestPath .\artifacts\market-manifest.json

          dotnet run --project ..\LanAirApp\airappmarket\tools\AirAppMarket.IndexBuilder -- `
            --validate-release-package ".\$assetName" `
            --market-manifest .\artifacts\market-manifest.json `
            --plugin-id Elysia.LanDesktopConnect

      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: Elysia.LanDesktopConnect-${{ github.sha }}
          path: |
            Elysia.LanDesktopConnect/Elysia.LanDesktopConnect.*.laapp
            Elysia.LanDesktopConnect/artifacts/market-manifest.json
          if-no-files-found: error
